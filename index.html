<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      TÍTULO, DESCRIÇÃO, CANONICAL, OPEN GRAPH E JSON-LD NÃO MORAM MAIS AQUI.

      Eles são injetados por rota em scripts/prerender.js, durante o build. O
      motivo: o domínio estava repetido em sete lugares deste arquivo, cada um
      com um comentário dizendo "trocar quando houver domínio próprio" — e a
      /privacidade herdava o title e o canonical da home, o que é erro de
      indexação. Agora existe uma fonte só (SITE_URL) e cada rota recebe o
      próprio conjunto.

      O que sobra aqui é o que vale para todas as rotas.
    -->

    <!-- Fontes. Nao ha mais preload de imagem: /rio-real.webp era pre-carregado
         com fetchpriority=high e nunca usado (o componente que o consumiria
         devolvia null), disputando banda com o LCP real. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Favicon (SEO-04) — retrato self-hostado, gerado por scripts/generate-favicon.js -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
