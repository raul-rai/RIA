<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      TÍTULO, DESCRIÇÃO, CANONICAL, OPEN GRAPH E JSON-LD NÃO MORAM MAIS AQUI.

      Eles são injetados por rota em scripts/prerender.js, durante o build. O
      motivo: o domínio estava repetido em sete lugares deste arquivo, cada um
      com um comentário dizendo "trocar quando houver domínio próprio" — e a
      /privacidade herdava o title e o canonical da home, o que é erro de
      indexação. Agora existe uma fonte só (SITE_URL) e cada rota recebe o
      próprio conjunto.

      O que sobra aqui é o que vale para todas as rotas.
    -->

    <!--
      AS FONTES NAO MORAM MAIS AQUI.

      Havia dois preconnect e uma folha de estilo de fonts.googleapis.com. Isso
      entregava o IP de todo visitante ao Google — num site que pede
      consentimento para medir navegacao e publica uma politica dizendo para
      onde os dados vao, sem mencionar este — e punha um terceiro
      render-blocking no caminho critico do LCP (228 ms so para a folha, antes
      de qualquer letra aparecer).

      Agora Inter e Playfair sao auto-hospedadas via @fontsource e importadas em
      src/main.tsx, saindo no mesmo bundle com hash do resto. Ver a nota la.

      Nao ha mais preload de imagem tambem: /rio-real.webp era pre-carregado com
      fetchpriority=high e nunca usado (o componente que o consumiria devolvia
      null), disputando banda com o LCP real.
    -->

    <!-- Favicon (SEO-04) — retrato self-hostado, gerado por scripts/generate-favicon.js -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
